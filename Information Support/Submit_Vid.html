<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="thankyouforsubmitting" href="/Information Support/Data Submission/Data_Sub_thx_for_report.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
    <title>FraudFile - Submit a Video</title>
</head>

<body style="background-color: #F0E0D6; display: flex; justify-content: center; align-items: center; gap: 20px; min-height: 85vh; margin: 0; padding: 10px; box-sizing: border-box; overflow-x: hidden;">
    <div style="display: flex; flex-direction: column; align-items: center;">
        <!-- Logo, CLICKABLE LINK TO HOME PAGE -->
        <a href="#Home">
            <h1 style="position: absolute; top: 15px; left: 20px; font-family: 'Inter', sans-serif; font-size: 28px; color: black; margin: 0;">
                FraudFiles<sup style="font-size: 12px;">TM</sup>
            </h1>
        </a>
        
        <h1>Add to the Video Library</h1>
        <p>1. Videos will either be approves or not approved</p>
        <p>2. Videos should be benefical to the community</p>

        <div style="background-color: #EDECE6; box-shadow: 25px 25px; border: solid; border-color: black; border-radius: 15px; width: 400px; padding: 20px;">
            <div style="margin: 15px 0px;">
                <p>Type of Video: </p>
                <select style="width: 100%; height: 35px; border-radius: 5px;">
                    <option>Anti-Scammers</option>
                    <option>Scammer Baiters</option>
                    <option>Other</option>
                </select>
            </div>

            <div style="margin: 15px 0px;">
                <p>Description: </p>
                <textarea placeholder="Describe what happened..." style="width: 95%; height: 120px; border-radius: 5px; resize: none;"></textarea>
            </div>
            
            <div style="margin: 15px 0px;">
                <p>Submit Here: </p>
                <input type="file">
            </div>

            <div style="margin: 20px auto; display: flex; justify-content: center;">
                <a href="/Information Support/Data Submission/Data_Sub_thx_for_report.html">
                    <button style="box-shadow: 10px 10px; font-size: larger; width: 150px; height: 40px; border-radius: 10px;">Submit Video</button>
                </a>
            </div>

        </div>
    </div>
</body>
</html>
