<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>FraudFiles</title>
</head>

<body>
    <nav class="navbar">
        <h2><a class="home" href="../index.html">THE FRAUD FILES</a></h2>
        <div class="navbarDIV"> 
            <a class = "navbarA" href="">Forum</a>
            <a class = "navbarA" href="leaderboard.html">Leaderboard</a>
            <a class = "navbarA" href="">Database</a>
            <a class = "navbarA" href="email-review.html">Review Emails</a>
        </div>
        <a class="login_button" href="login.html">Login</a>
    </nav>
    <div class="whole-email-page">
        <div class="main-email-section">
            <img id="email-image" src="../images/email1.png" width="500" height="360" style="display: block; margin: 0 auto;"/>
            <div class="email-button-container">

                <button id="real-button" class="email-button"  style="width: 200px; height: 75px;">Real</button>
                <button id="fake-button" class="email-button" style="width: 200px; height: 75px;">Fake</button>

                <script>

                    const emails = [
                        "../images/email1.png",
                        "../images/email2.png",
                        "../images/email3.png",
                        "../images/email4.png",
                    ];

                    let currentIndex = 0;
                    const imgElement = document.getElementById("email-image");
                    const buttons = document.querySelectorAll(".email-button");

                    function showNextImage() {
                        currentIndex = (currentIndex + 1) % emails.length;
                        imgElement.src = emails[currentIndex];
                    }

                    buttons.forEach((button) => {
                        button.addEventListener("click", showNextImage);
                    });
                </script>
            </div>
        </div>

        <button id="phone-button" style="width: 200px; height: 75px; align-self: flex-end;">Enter Phone Call</button>

        <script>
        const phoneButton = document.getElementById("phone-button");

        phoneButton.addEventListener("click", () => {
            window.location.href="../Direct Scam Protection/phone-call.html"
        });
    </script>

    </div>

</body>
</html>
